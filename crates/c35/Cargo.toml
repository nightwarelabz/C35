[package]
name = "c35"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Comigen — a cost-accounted procedural game graphics engine (core renderer)."

[dependencies]
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "27", features = ["webgl"] }

[dev-dependencies]
# Same naga wgpu 27 compiles shaders with — used by
# tests/shader_validation.rs to parse/validate every WGSL source
# without needing a GPU adapter.
naga = { version = "27.0.3", features = ["wgsl-in"] }
